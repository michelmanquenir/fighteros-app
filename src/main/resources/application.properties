spring.application.name=fighteros-app

# Servidor Port
server.port=${PORT:8080}

# Configuracion de Supabase Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Flyway — Supabase entrega el schema "public" con objetos propios de la plataforma
# (no completamente vacío), así que baseline-amos en la versión 0 para que Flyway
# no se niegue a migrar y corra igual nuestras V1..V7 sin saltarse ninguna.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hibernate — el esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


# HikariCP — limitar conexiones para Supabase free tier (Session mode pooler)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# Logging — suprimir warning de UserDetailsService (JWT maneja auth directamente)
logging.level.org.springframework.boot.autoconfigure.security=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration=ERROR

# Actuator — endpoint de salud para monitoreo externo (UptimeRobot, etc.)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never